<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kids Monster Truck Simulator - Petualangan Truk Ceria & Klakson Telolet 🚚</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Font: Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Fredoka', cursive, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      background-color: #0f172a;
    }
    .btn-3d {
      transition: all 0.08s ease;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35);
    }
    .btn-3d:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
    }
    @keyframes horn-ring {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15) rotate(-4deg); }
    }
    .horn-pulse {
      animation: horn-ring 0.2s infinite ease-in-out;
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between bg-slate-950 text-white">

  <!-- ========================================== -->
  <!-- 1. HEADER RINGKAS & ELEGAN (RAMAH REKAM)   -->
  <!-- ========================================== -->
  <header class="w-full bg-slate-900/90 backdrop-blur-md px-3 sm:px-4 py-2 flex items-center justify-between border-b border-slate-800 z-30 shrink-0">
    <!-- Brand Title -->
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-2xl bg-amber-400 text-slate-950 flex items-center justify-center text-lg shadow-md border-2 border-amber-300">
        <i class="fas fa-truck-monster"></i>
      </div>
      <div>
        <h1 class="text-sm sm:text-base font-extrabold text-white leading-tight">Truk Petualang Cilik</h1>
        <p class="text-[10px] sm:text-[11px] text-amber-400 font-semibold flex items-center gap-1">
          <i class="fas fa-gamepad"></i>
          <span>Fisika 3D Asli & 100+ Level Tantangan</span>
        </p>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="flex items-center gap-2">
      <!-- Petunjuk Kontrol Cepat -->
      <span class="hidden md:inline-flex items-center gap-1 px-3 py-1 rounded-xl bg-slate-800 border border-slate-700 text-xs text-slate-300 font-medium">
        <i class="fas fa-keyboard text-amber-400"></i>
        <span>Tombol Panah / W & D untuk Menyetir</span>
      </span>

      <!-- Tombol Klakson Telolet Header -->
      <button onclick="playTeloletHorn()" class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-black text-xs flex items-center gap-1.5 btn-3d shadow-md" title="Bunyikan Klakson Telolet">
        <i class="fas fa-bullhorn text-rose-600"></i>
        <span>TELOLET!</span>
      </button>

      <!-- Tombol Layar Penuh (Fullscreen) untuk Rekam Layar YouTube -->
      <button onclick="toggleFullscreen()" class="w-9 h-9 rounded-xl bg-sky-500 hover:bg-sky-400 text-white flex items-center justify-center text-sm shadow btn-3d" title="Layar Penuh (Cocok untuk Rekam YouTube)">
        <i class="fas fa-expand"></i>
      </button>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- 2. GAME VIEWPORT IFRAME (100% FLUID FULL)  -->
  <!-- ========================================== -->
  <main class="relative flex-1 w-full h-full bg-black overflow-hidden flex items-center justify-center">
    
    <!-- Iframe Game Engine Murni (Drive Mad Engine Tanpa Lag) -->
    <iframe 
      id="gameFrame" 
      src="game-engine.html" 
      class="w-full h-full border-0 block" 
      allow="autoplay; fullscreen; gamepad; focus-without-user-activation" 
      allowfullscreen>
    </iframe>

    <!-- FLOATING TELOLET BUTTON (POJOK KANAN BAWAH) -->
    <button 
      id="floatingHornBtn" 
      onclick="playTeloletHorn()" 
      class="absolute bottom-5 right-5 z-20 w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-tr from-amber-500 via-yellow-400 to-amber-300 text-slate-950 font-black flex flex-col items-center justify-center shadow-2xl border-4 border-white btn-3d active:scale-95 ring-4 ring-amber-400/40" 
      title="Bunyikan Klakson Telolet!">
      <i class="fas fa-bullhorn text-rose-600 text-2xl sm:text-3xl"></i>
      <span class="text-[9px] sm:text-[10px] font-black tracking-tighter uppercase mt-0.5">TELOLET!</span>
    </button>

  </main>

  <!-- ========================================== -->
  <!-- 3. FOOTER PROMOSI & AFFILIATE SHOPEE       -->
  <!-- ========================================== -->
  <footer class="w-full bg-slate-900 px-3 py-2 flex items-center justify-between border-t border-slate-800 text-xs shrink-0 z-30">
    <div class="flex items-center gap-2 text-slate-400 text-[11px]">
      <i class="fas fa-mobile-screen text-emerald-400"></i>
      <span>HP: Ketuk sisi kanan layar untuk Gas, sisi kiri untuk Rem/Mundur.</span>
    </div>

    <!-- Tombol Affiliate Mainan Shopee -->
    <a href="https://s.shopee.co.id/8UoXyz123" target="_blank" class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-400 hover:to-amber-400 px-3.5 py-1.5 rounded-xl text-white font-bold text-xs flex items-center gap-1.5 shadow-lg transition active:scale-95">
      <i class="fas fa-bag-shopping"></i>
      <span>Beli Mainan Truk Mini di Shopee 🛒</span>
    </a>
  </footer>

  <!-- ========================================== -->
  <!-- 4. AUDIO TELOLET BASURI SYNTHESIZER        -->
  <!-- ========================================== -->
  <script>
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTeloletHorn() {
      initAudio();
      const now = audioCtx.currentTime;
      // Melodi Telolet Basuri Arpeggio
      const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 523.25, 659.25];
      const step = 0.085;

      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now + idx * step);

        gain.gain.setValueAtTime(0.2, now + idx * step);
        gain.gain.exponentialRampToValueAtTime(0.001, now + (idx + 1) * step + 0.05);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * step);
        osc.stop(now + (idx + 1) * step + 0.06);
      });

      const btn = document.getElementById('floatingHornBtn');
      btn.classList.add('horn-pulse');
      setTimeout(() => btn.classList.remove('horn-pulse'), 600);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }
  </script>
</body>
</html>
